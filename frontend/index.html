<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Autorrecuperação de "tela branca" por cache desatualizado (24/08/2026):
      // quando o Service Worker (ou o cache do navegador) guarda uma versão
      // velha do index.html, ela aponta pros arquivos JS/CSS daquele build
      // antigo. Se esse build não é mais o publicado no servidor, o Vercel
      // devolve o próprio index.html no lugar (fallback de rota de SPA) — o
      // navegador recebe HTML onde esperava JavaScript e BLOQUEIA por
      // segurança ("Failed to load module script ... MIME type text/html").
      // O app inteiro nem chega a carregar, e sem isso aqui não tinha como
      // saber o motivo — ficava só a tela branca. Esse script roda ANTES de
      // tudo (nem depende do bundle React carregar): se detectar esse erro
      // específico, apaga o Service Worker + caches do navegador e recarrega
      // direto do servidor, uma vez só por sessão pra não entrar em loop.
      (function () {
        var CHAVE = "financepro_recuperou_tela_branca";
        window.addEventListener(
          "error",
          function (evento) {
            var alvo = evento.target;
            var url = alvo && (alvo.src || alvo.href);
            var ehAssetDoApp =
              alvo &&
              (alvo.tagName === "SCRIPT" || alvo.tagName === "LINK") &&
              typeof url === "string" &&
              url.indexOf("/assets/") !== -1;

            if (!ehAssetDoApp) return;
            if (sessionStorage.getItem(CHAVE) === "1") return;
            sessionStorage.setItem(CHAVE, "1");

            Promise.resolve()
              .then(function () {
                if ("serviceWorker" in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                  });
                }
              })
              .then(function () {
                if ("caches" in window) {
                  return caches.keys().then(function (chaves) {
                    return Promise.all(chaves.map(function (c) { return caches.delete(c); }));
                  });
                }
              })
              .catch(function () {})
              .then(function () {
                window.location.reload();
              });
          },
          true
        );
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0753cc" />
    <meta name="description" content="Gestão financeira profissional e centralizada." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinancePro" />
    <title>FinancePro</title>

    <!-- Pedido do usuário (26/08/2026): "toda vez que saio e volto
         rápido abre uma tela preta". O celular/navegador descarrega a
         aba de memória quando ela fica em segundo plano (comportamento
         do sistema operacional em PWA, fora do nosso controle) — ao
         voltar, a página recarrega do zero, e enquanto o React ainda
         não montou, ficava um vazio escuro parado. Esse estilo (aplica
         antes de qualquer CSS externo carregar) + o placeholder abaixo
         garantem que, mesmo nesse instante, já apareça a marca/spinner
         em vez de tela vazia. */ -->
    <style>
      html, body {
        margin: 0;
        background: #020b16;
      }
      #carregamento-inicial {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #020b16;
        color: #e7edf5;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }
      #carregamento-inicial strong {
        font-size: 22px;
        letter-spacing: 0.02em;
      }
      #carregamento-inicial .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid rgba(231, 237, 245, 0.2);
        border-top-color: #0753cc;
        animation: girar 0.8s linear infinite;
      }
      @keyframes girar {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="carregamento-inicial">
        <div class="spinner"></div>
        <strong>FinancePro</strong>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
