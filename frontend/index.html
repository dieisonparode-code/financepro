<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      // Autorrecuperação de "tela branca" por cache desatualizado (24/08/2026):
      // quando o Service Worker (ou o cache do navegador) guarda uma versão
      // velha do index.html, ela aponta pros arquivos JS/CSS daquele build
      // antigo. Se esse build não é mais o publicado no servidor, o Vercel
      // devolve o próprio index.html no lugar (fallback de rota de SPA) — o
      // navegador recebe HTML onde esperava JavaScript e BLOQUEIA por
      // segurança ("Failed to load module script ... MIME type text/html").
      // O app inteiro nem chega a carregar, e sem isso aqui não tinha como
      // saber o motivo — ficava só a tela branca. Esse script roda ANTES de
      // tudo (nem depende do bundle React carregar): se detectar esse erro
      // específico, apaga o Service Worker + caches do navegador e recarrega
      // direto do servidor, uma vez só por sessão pra não entrar em loop.
      (function () {
        var CHAVE = "financepro_recuperou_tela_branca";
        window.addEventListener(
          "error",
          function (evento) {
            var alvo = evento.target;
            var url = alvo && (alvo.src || alvo.href);
            var ehAssetDoApp =
              alvo &&
              (alvo.tagName === "SCRIPT" || alvo.tagName === "LINK") &&
              typeof url === "string" &&
              url.indexOf("/assets/") !== -1;

            if (!ehAssetDoApp) return;
            if (sessionStorage.getItem(CHAVE) === "1") return;
            sessionStorage.setItem(CHAVE, "1");

            Promise.resolve()
              .then(function () {
                if ("serviceWorker" in navigator) {
                  return navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                  });
                }
              })
              .then(function () {
                if ("caches" in window) {
                  return caches.keys().then(function (chaves) {
                    return Promise.all(chaves.map(function (c) { return caches.delete(c); }));
                  });
                }
              })
              .catch(function () {})
              .then(function () {
                window.location.reload();
              });
          },
          true
        );
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0753cc" />
    <meta name="description" content="Gestão financeira profissional e centralizada." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinancePro" />
    <title>FinancePro</title>

    <!-- Pedido do usuário (26/08/2026): fundo escuro aplicado antes de
         qualquer CSS externo carregar, pra não piscar branco/claro no
         instante entre o navegador abrir a página e o resto do app
         montar. Removido o spinner/texto que tinha aqui (deixava a
         espera parecer mais longa, a pedido do usuário) — só a cor de
         fundo mesmo, igual o resto do app já usa. -->
    <style>
      html, body {
        margin: 0;
        background: #020b16;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
